<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orçamento - Chuk's Car Services</title><link rel="stylesheet" href="css/erp.css"></head>
<body>
<div class="topo" id="topo"></div>
<div class="modal">
  <header><h1>Orçamento / Ordem de serviço</h1><a class="fechar" href="index.html">&#10005;</a></header>
  <div class="corpo">
    <div class="col">
      <h2 class="sec">Identificação do veículo</h2>
      <div class="linha"><label>Chassi (17 caracteres)</label><input class="g" id="chassi" maxlength="17" style="text-transform:uppercase"></div>
      <div class="linha"><label>Marca</label><input class="m" id="marca"></div>
      <div class="linha"><label>Modelo</label><input class="m" id="modelo"></div>
      <div class="linha"><label>Ano</label><input class="p" id="ano" type="number"></div>
      <div class="linha"><label>Cor</label><input class="m" id="cor"></div>
      <div class="linha"><label>Placa</label><input class="m" id="placa" maxlength="8"></div>
      <div class="linha"><label>Nº do prisma</label><input class="m" id="prisma"></div>
      <div class="linha"><label>KM</label><input class="m" id="km" type="number"><span class="badge">km</span></div>
      <div class="linha"><label>Data de chegada</label><input class="m" id="dataChegada" type="date"></div>
      <div class="linha"><label>Abertura da OS</label><input class="m" id="dataAberturaOS" type="date"></div>
    </div>
    <div class="col">
      <h2 class="sec">Serviço</h2>
      <div class="linha"><label>Tipo de serviço</label><input class="m" id="tipoServico"></div>
      <div class="linha"><label>Revisão</label><input class="m" id="revisao"></div>
      <div class="linha"><label>Garantia</label><input class="m" id="garantia"></div>
      <div class="linha"><label>Responsável técnico</label><input class="m" id="responsavelTecnico"></div>
      <div class="linha"><label>Reclamações do cliente</label></div><textarea id="reclamacoesCliente"></textarea>
      <div class="linha"><label>Diagnóstico</label></div><textarea id="diagnostico"></textarea>
      <div class="linha"><label>Serviço a fazer</label></div><textarea id="servicoAFazer"></textarea>
      <div class="linha"><label>Observação do cliente</label></div><textarea id="observacaoCliente"></textarea>
      <div class="linha"><label>Problemas enfrentados</label></div><textarea id="problemasEnfrentados"></textarea>
    </div>
  </div>
  <div class="rodape"><span id="msg"></span>
    <button class="sec2" id="novo">Novo</button><button id="salvar">Salvar orçamento</button></div>
</div>

<div class="modal">
  <header><h1>Orçamentos salvos</h1></header>
  <div class="corpo uma"><div class="col">
    <table class="lista"><thead><tr><th>Chassi</th><th>Veículo</th><th>Placa</th><th>Chegada</th><th>Tipo</th></tr></thead>
    <tbody id="lista"></tbody></table></div></div>
</div>

<script src="erp.js"></script>
<script>
menu("orcamento.html");
const TEXTOS = ["chassi","modelo","cor","marca","placa","prisma","dataChegada","dataAberturaOS","reclamacoesCliente",
  "tipoServico","revisao","diagnostico","garantia","observacaoCliente","servicoAFazer","responsavelTecnico","problemasEnfrentados"];
const NUMEROS = ["ano","km"];
let idAtual = null, cache = [];

function preencher(o) {
  idAtual = o ? o.id : null;
  [...TEXTOS, ...NUMEROS].forEach(id => set(id, o ? o[id] : ""));
  msg(idAtual ? "Editando orçamento salvo." : "", "");
}

async function carregar() {
  const r = await fetch("/api/orcamentos"); cache = r.ok ? await r.json() : [];
  document.getElementById("lista").innerHTML = cache.map((o, i) =>
    `<tr class="clic" data-i="${i}"><td>${esc(o.chassi)}</td><td>${esc([o.marca, o.modelo, o.ano].filter(Boolean).join(" "))}</td>
     <td>${esc(o.placa)}</td><td>${esc(o.dataChegada)}</td><td>${esc(o.tipoServico)}</td></tr>`).join("")
     || '<tr><td colspan="5">Nenhum orçamento salvo.</td></tr>';
  document.querySelectorAll("#lista tr.clic").forEach(tr => tr.onclick = () => { preencher(cache[tr.dataset.i]); scrollTo(0, 0); });
}

document.getElementById("novo").onclick = () => preencher(null);
document.getElementById("salvar").onclick = async e => {
  e.target.disabled = true; msg("");
  try {
    const corpo = {};
    TEXTOS.forEach(id => corpo[id] = val(id));
    NUMEROS.forEach(id => corpo[id] = val(id) === "" ? null : Number(val(id)));
    const salvo = await enviarJson(idAtual ? "/api/orcamentos/" + idAtual : "/api/orcamentos", idAtual ? "PUT" : "POST", corpo);
    idAtual = salvo.id; msg("Orçamento salvo.", "ok"); carregar();
  } catch (err) { msg(err.message, "erro"); }
  e.target.disabled = false;
};
carregar();
</script>
</body></html>
