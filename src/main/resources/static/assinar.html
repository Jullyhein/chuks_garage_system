<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assinar checklist - Chuk's Car Services</title><link rel="stylesheet" href="css/erp.css"></head>
<body>
<div class="modal">
  <header><h1>Assinatura do checklist</h1></header>
  <div class="corpo" id="conteudo">
    <div class="col">
      <h2 class="sec">Seu checklist</h2>
      <div class="linha"><label>Cliente</label><input class="g cinza" id="nome" readonly></div>
      <div class="linha"><label>Veículo</label><input class="g cinza" id="veiculo" readonly></div>
      <div class="linha"><label>Placa</label><input class="m cinza" id="placa" readonly></div>
      <div class="linha"><span></span><a class="btn sec2" id="baixar">Baixar PDF do checklist</a></div>
    </div>
    <div class="col">
      <h2 class="sec">Como assinar</h2>
      <div class="linha"><label>1. Baixe o PDF ao lado (ou use o anexo do e-mail).</label></div>
      <div class="linha"><label>2. Acesse <b>assinador.iti.br</b> e assine com sua conta gov.br (nível prata ou ouro).</label></div>
      <div class="linha"><label>3. Envie aqui o PDF já assinado:</label></div>
      <div class="linha"><input type="file" id="arquivo" accept="application/pdf" style="background:#fff;border-color:#ccc"></div>
      <div class="linha"><span></span><button id="enviar">Enviar PDF assinado</button></div>
    </div>
  </div>
  <div class="rodape"><span id="msg"></span></div>
</div>
<script src="erp.js"></script>
<script>
const token = new URLSearchParams(location.search).get("token") || "";
const base = "/api/assinaturas/" + encodeURIComponent(token);

fetch(base).then(async r => {
  if (!r.ok) { document.getElementById("conteudo").innerHTML =
    '<div class="col"><p>Link inválido ou expirado. Peça um novo e-mail à oficina.</p></div>'; return; }
  const d = await r.json();
  set("nome", d.nome); set("veiculo", d.veiculo); set("placa", d.placa);
  document.getElementById("baixar").href = base + "/pdf";
  if (d.assinado) { document.getElementById("enviar").disabled = true; msg("Este checklist já foi assinado. Obrigado!", "ok"); }
});

document.getElementById("enviar").onclick = async e => {
  const arq = document.getElementById("arquivo").files[0];
  if (!arq) { msg("Selecione o PDF assinado.", "erro"); return; }
  e.target.disabled = true; msg("Enviando...");
  try {
    const f = new FormData(); f.append("arquivo", arq);
    const r = await fetch(base, { method: "POST", body: f });
    const d = await lerResposta(r);
    if (!r.ok) throw new Error(d.erro || "Erro " + r.status);
    msg("Assinatura recebida. Obrigado!", "ok");
  } catch (err) { msg(err.message, "erro"); e.target.disabled = false; }
};
</script>
</body></html>
