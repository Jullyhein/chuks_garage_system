<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chuk's Car Services - Checklist do Veículo</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<div class="page-wrapper">
    <div class="card">

        <img src="images/chuks_logo.png" alt="Chuk's Car Services" class="logo">

        <h1>Checklist do Veículo</h1>

        <form id="formChecklist">
            <input type="hidden" name="atendimentoId" id="atendimentoId">

            <fieldset>
                <legend>Dados do cliente</legend>

                <label for="nomeCliente">Nome:</label>
                <input type="text" id="nomeCliente" name="nomeCliente" required>

                <label for="endereco">Endereço:</label>
                <input type="text" id="endereco" name="endereco">

                <label for="email">E-mail (o cliente receberá uma cópia do checklist):</label>
                <input type="email" id="email" name="email" required>

                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone" required>
            </fieldset>

            <fieldset>
                <legend>Veículo</legend>

                <label for="dataInspecao">Data:</label>
                <input type="date" id="dataInspecao" name="dataInspecao" required>

                <label for="veiculo">Veículo:</label>
                <input type="text" id="veiculo" name="veiculo" required>

                <label for="placa">Placa:</label>
                <input type="text" id="placa" name="placa" maxlength="8" required>

                <label for="numeroCarro">Nº do carro:</label>
                <input type="text" id="numeroCarro" name="numeroCarro" required>

                <label for="kmOdometro">KM (odômetro):</label>
                <input type="number" id="kmOdometro" name="kmOdometro" min="0" required>

                <label for="nivelGasolina">Nível de gasolina:</label>
                <select id="nivelGasolina" name="nivelGasolina" required>
                    <option value="">Selecione</option>
                    <option>Vazio</option>
                    <option>1/4</option>
                    <option>1/2</option>
                    <option>3/4</option>
                    <option>Cheio</option>
                </select>
            </fieldset>

            <fieldset>
                <legend>Condições gerais (escolha uma)</legend>

                <div class="opcao">
                    <input type="radio" id="condFunc" name="condicao" value="funcionamento" required>
                    <label for="condFunc">Veículo em funcionamento</label>
                </div>

                <div class="opcao">
                    <input type="radio" id="condGuincho" name="condicao" value="guincho">
                    <label for="condGuincho">Veio de guincho</label>
                </div>
            </fieldset>

            <fieldset>
                <legend>Inspeção visual (👍 conforme / 👎 problema)</legend>

                <div class="resumo-inspecao">
                    <span id="progresso"></span>
                    <button type="button" class="btn-sec" id="btnTodosOk">👍 Marcar todos como OK</button>
                </div>

                <div id="inspecao"></div>
            </fieldset>

            <fieldset>
                <legend>Fotos do veículo (mínimo 10, máximo 11)</legend>

                <button type="button" class="btn-sec" id="btnCamera">📷 Tirar foto</button>
                <button type="button" class="btn-sec" id="btnGaleria">🖼️ Escolher da galeria</button>

                <input type="file" id="fotoCamera" accept="image/*" capture="environment" hidden>
                <input type="file" id="fotoGaleria" accept="image/*" multiple hidden>

                <p id="contador" class="contador"></p>
                <div id="previews"></div>
            </fieldset>

            <button type="submit">Salvar checklist</button>
        </form>

        <p id="msg" class="msg"></p>

    </div>
</div>

<script>
    const MIN_FOTOS = 2;
    const MAX_FOTOS = 11;

    // ---------- Itens da inspeção (baseados na NBR 14624) ----------
    const SECOES = [
        { nome: 'Internos', itens: [
            'Limpador e lavador de para-brisa',
            'Extintor - opcional',
            'Buzina',
            'Cinto de segurança',
            'Freio de estacionamento',
            'Volante e coluna',
            'Acionamento do sistema de embreagem'
        ]},
        { nome: 'Externos', itens: [
            'Triângulo de segurança',
            'Estepe',
            'Luz indicadora de direção (seta)',
            'Luz de freio',
            'Luz de posição (lanterna)',
            'Luz de ré',
            'Luz de placa traseira',
            'Luz dos faróis principais'
        ]},
        { nome: 'Compartimentos do motor', itens: [
            'Nível do reservatório do fluido de freio',
            'Nível do reservatório do líquido de arrefecimento',
            'Correias e tensores',
            'Vazamentos',
            'Bateria (utilizar voltímetro)',
            'Cabo de ignição',
            'Alternador (utilizar voltímetro)',
            'Luz de anomalia (quando existente)',
            'Climatização (ar quente e frio)'
        ]},
        { nome: 'Inferiores', itens: [
            'Estado geral de fixação das rodas',
            'Desgaste da banda de rodagem (TWI)',
            'Amortecedores',
            'Bandejas, braços, pivôs, coifas e batentes'
        ]}
    ];

    const OPCIONAIS = [2]; // nº dos itens que podem ficar sem resposta (extintor)

    const form = document.getElementById('formChecklist');
    const msg = document.getElementById('msg');
    const previews = document.getElementById('previews');
    const contador = document.getElementById('contador');
    const fotoCamera = document.getElementById('fotoCamera');
    const fotoGaleria = document.getElementById('fotoGaleria');
    const inspecao = document.getElementById('inspecao');
    const progresso = document.getElementById('progresso');

    let fotosSelecionadas = [];

    function mostrarMsg(texto, ok) {
        msg.textContent = texto;
        msg.className = 'msg ' + (ok ? 'ok' : 'erro');
    }

    // ---------- Data de hoje (horário local) ----------
    function definirData() {
        const h = new Date();
        document.getElementById('dataInspecao').value =
            h.getFullYear() + '-' +
            String(h.getMonth() + 1).padStart(2, '0') + '-' +
            String(h.getDate()).padStart(2, '0');
    }
    definirData();

    // placa sempre em maiúsculas
    document.getElementById('placa').addEventListener('input', function (e) {
        e.target.value = e.target.value.toUpperCase();
    });

    // ---------- Dados do cliente (tela inicial) ----------
    const atendimentoId = new URLSearchParams(location.search).get('atendimentoId');
    document.getElementById('atendimentoId').value = atendimentoId || '';

    if (atendimentoId) {
        fetch('/api/checklists/cliente/' + atendimentoId)
            .then(r => r.ok ? r.json() : Promise.reject())
            .then(d => {
                document.getElementById('nomeCliente').value = d.nome || '';
                document.getElementById('email').value = d.email || '';
                document.getElementById('veiculo').value =
                    [d.marca, d.carro, d.ano].filter(Boolean).join(' ');
            })
            .catch(() => mostrarMsg('Não foi possível carregar os dados do cliente.', false));
    }

    // ---------- Inspeção visual ----------
    function criarLinha(numero, secao, descricao, ehOutros, uid) {
        const linha = document.createElement('div');
        linha.className = 'item';
        linha.dataset.numero = numero;
        linha.dataset.secao = secao;
        linha.dataset.descricao = descricao;

        const titulo = ehOutros
            ? '<input type="text" class="outros-desc" maxlength="80" placeholder="Outros (descreva o item, se houver)">'
            : '<span class="num">' + numero + '</span>' + descricao;

        linha.innerHTML =
            '<div class="item-titulo">' + titulo + '</div>' +
            '<div class="item-acoes">' +
                '<input type="radio" id="ok-' + uid + '" name="st-' + uid + '" value="OK">' +
                '<label for="ok-' + uid + '" class="opt ok" title="Conforme">👍</label>' +
                '<input type="radio" id="pr-' + uid + '" name="st-' + uid + '" value="PROBLEMA">' +
                '<label for="pr-' + uid + '" class="opt ruim" title="Problema">👎</label>' +
                '<input type="text" class="obs" maxlength="200" placeholder="OBS">' +
            '</div>';
        return linha;
    }

    function montarInspecao() {
        let numero = 0;
        SECOES.forEach(function (secao, indice) {
            const bloco = document.createElement('div');
            bloco.className = 'secao';
            bloco.innerHTML = '<h3>' + secao.nome + '</h3>';

            secao.itens.forEach(function (descricao) {
                numero++;
                bloco.appendChild(criarLinha(numero, secao.nome, descricao, false, numero));
            });

            bloco.appendChild(criarLinha(0, secao.nome, '', true, 'o' + indice));
            inspecao.appendChild(bloco);
        });
        atualizarProgresso();
    }

    function atualizarProgresso() {
        const linhas = document.querySelectorAll('.item:not([data-numero="0"])');
        let feitos = 0;
        linhas.forEach(function (l) {
            if (l.querySelector('input[type=radio]:checked')) feitos++;
        });
        progresso.textContent = feitos + ' de ' + linhas.length + ' itens verificados';
    }

    // qualquer mudança na inspeção: atualiza contador e tira o destaque de pendência
    inspecao.addEventListener('input', function (e) {
        const linha = e.target.closest('.item');
        if (linha) linha.classList.remove('pendente');
        atualizarProgresso();
    });

    document.getElementById('btnTodosOk').addEventListener('click', function () {
        document.querySelectorAll('.item:not([data-numero="0"])').forEach(function (l) {
            if (!l.querySelector('input[type=radio]:checked')) {
                l.querySelector('input[value="OK"]').checked = true;
                l.classList.remove('pendente');
            }
        });
        atualizarProgresso();
    });

    // lê as linhas, monta a lista e aponta o que está faltando
    function coletarItens() {
        const itens = [];
        const pendencias = [];

        document.querySelectorAll('.item').forEach(function (linha) {
            linha.classList.remove('pendente');

            const numero = Number(linha.dataset.numero);
            const nome = numero === 0 ? 'Outros' : 'Item ' + numero;
            const marcado = linha.querySelector('input[type=radio]:checked');
            const status = marcado ? marcado.value : null;
            const obs = linha.querySelector('.obs').value.trim();
            let descricao = linha.dataset.descricao;

            if (numero === 0) {
                const texto = linha.querySelector('.outros-desc').value.trim();
                if (!texto && !status && !obs) return;          // linha "Outros" vazia
                if (!texto) {
                    pendencias.push({ linha: linha, motivo: nome + ': descreva o item' });
                    return;
                }
                descricao = 'Outros: ' + texto;
            }

            if (!status) {
                if (OPCIONAIS.includes(numero)) return;          // opcional sem resposta: ignora
                pendencias.push({ linha: linha, motivo: nome + ': marque 👍 ou 👎' });
                return;
            }

            if (status === 'PROBLEMA' && !obs) {
                pendencias.push({ linha: linha, motivo: nome + ': descreva o problema no OBS' });
                return;
            }

            itens.push({
                numero: numero,
                secao: linha.dataset.secao,
                descricao: descricao,
                status: status,
                obs: obs
            });
        });

        return { itens: itens, pendencias: pendencias };
    }

    montarInspecao();

    // ---------- Fotos ----------
    function renderizarFotos() {
        previews.innerHTML = '';

        fotosSelecionadas.forEach(function (arquivo, indice) {
            const div = document.createElement('div');
            div.className = 'thumb';

            const img = document.createElement('img');
            img.src = URL.createObjectURL(arquivo);

            const remover = document.createElement('button');
            remover.type = 'button';
            remover.className = 'thumb-remover';
            remover.textContent = '×';
            remover.addEventListener('click', function () {
                fotosSelecionadas.splice(indice, 1);
                renderizarFotos();
            });

            div.appendChild(img);
            div.appendChild(remover);
            previews.appendChild(div);
        });

        const total = fotosSelecionadas.length;
        contador.textContent = total + ' de ' + MAX_FOTOS + ' fotos (mínimo ' + MIN_FOTOS + ')';
        contador.className = total >= MIN_FOTOS ? 'contador ok' : 'contador';
    }

    function adicionarFotos(lista) {
        let passouDoLimite = false;

        Array.from(lista).forEach(function (arquivo) {
            if (fotosSelecionadas.length >= MAX_FOTOS) {
                passouDoLimite = true;
                return;
            }
            fotosSelecionadas.push(arquivo);
        });

        if (passouDoLimite) {
            alert('Máximo de ' + MAX_FOTOS + ' fotos. As que passaram do limite foram ignoradas.');
        }
        renderizarFotos();
    }

    document.getElementById('btnCamera').addEventListener('click', () => fotoCamera.click());
    document.getElementById('btnGaleria').addEventListener('click', () => fotoGaleria.click());

    [fotoCamera, fotoGaleria].forEach(function (input) {
        input.addEventListener('change', function () {
            adicionarFotos(input.files);
            input.value = '';
        });
    });

    renderizarFotos();

    // ---------- Envio ----------
    form.addEventListener('submit', async function (evento) {
        evento.preventDefault();

        if (fotosSelecionadas.length < MIN_FOTOS) {
            mostrarMsg('Faltam fotos: envie no mínimo ' + MIN_FOTOS +
                ' (você tem ' + fotosSelecionadas.length + ').', false);
            return;
        }

        const coleta = coletarItens();
        if (coleta.pendencias.length > 0) {
            coleta.pendencias.forEach(p => p.linha.classList.add('pendente'));
            coleta.pendencias[0].linha.scrollIntoView({ behavior: 'smooth', block: 'center' });
            mostrarMsg(coleta.pendencias.length + ' pendência(s) na inspeção. Primeira: ' +
                coleta.pendencias[0].motivo + '.', false);
            return;
        }

        const dados = new FormData(form);

        const condicao = dados.get('condicao');
        dados.delete('condicao');
        dados.set('emFuncionamento', condicao === 'funcionamento' ? 'true' : 'false');
        dados.set('veioDeGuincho', condicao === 'guincho' ? 'true' : 'false');

        dados.append('itensJson', JSON.stringify(coleta.itens));

        fotosSelecionadas.forEach(function (arquivo) {
            dados.append('fotos', arquivo);
        });

        try {
            const resposta = await fetch('/api/checklists', { method: 'POST', body: dados });

            if (resposta.ok) {
                const resultado = await resposta.json();
                if (resultado.emailEnviado) {
                    mostrarMsg('Checklist salvo e enviado por e-mail ao cliente!', true);
                } else {
                    mostrarMsg('Checklist salvo, mas o e-mail NÃO foi enviado. Confira o endereço de e-mail.', false);
                }
                form.reset();
                fotosSelecionadas = [];
                renderizarFotos();
                definirData();
                atualizarProgresso();
            } else {
                const erro = await resposta.json().catch(() => null);
                mostrarMsg((erro && erro.erro) || 'Erro ao salvar o checklist.', false);
            }
        } catch (erro) {
            mostrarMsg('Erro de conexão: ' + erro, false);
        }
    });
</script>

</body>
</html>
