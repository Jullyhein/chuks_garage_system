<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checklist - Chuk's Car Services</title><link rel="stylesheet" href="css/erp.css"></head>
<body>
<div class="topo" id="topo"></div>

<div class="modal">
  <header><h1>Checklist do veículo</h1><a class="fechar" href="index.html">&#10005;</a></header>
  <div class="corpo">
    <div class="col">
      <h2 class="sec">Atendimento</h2>
      <div class="linha"><label>Preencher a partir do atendimento</label>
        <select class="g" id="atendimentoId"><option value="">Selecione (opcional)</option></select></div>

      <h2 class="sec">Dados do cliente</h2>
      <div class="linha"><label>Cliente</label><input class="g" id="nomeCliente"></div>
      <div class="linha"><label>Endereço</label><input class="g" id="endereco"></div>
      <div class="linha"><label>E-mail (recebe o PDF para assinar)</label><input class="g" id="email" type="email"></div>
      <div class="linha"><label>Telefone</label><input class="m" id="telefone"></div>

      <h2 class="sec">Dados do veículo</h2>
      <div class="linha"><label>Veículo</label><input class="g" id="veiculo"></div>
      <div class="linha"><label>Placa</label><input class="m" id="placa" maxlength="8"></div>
      <div class="linha"><label>KM (odômetro)</label><input class="m" id="kmOdometro" type="number" min="0"><span class="badge">km</span></div>
      <div class="linha"><label>Nível de gasolina</label>
        <select class="m" id="nivelGasolina"><option value="">Selecione</option>
          <option>Reserva</option><option>1/4</option><option>1/2</option><option>3/4</option><option>Cheio</option></select></div>
      <div class="linha"><label>Data da inspeção</label><input class="m" id="dataInspecao" type="date"></div>
      <div class="linha"><label><input type="checkbox" id="emFuncionamento"> Em funcionamento</label>
        <label><input type="checkbox" id="veioDeGuincho"> Veio de guincho</label></div>
    </div>

    <div class="col">
      <h2 class="sec">Inspeção visual</h2>
      <table class="lista" id="itens">
        <thead><tr><th>Seção</th><th>Descrição</th><th>Status</th><th>Obs.</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
      <div class="linha"><button class="sec2" id="addItem">+ Adicionar item</button></div>

      <h2 class="sec">Fotos do veículo (2 a 11)</h2>
      <div class="linha"><input type="file" id="fotos" accept="image/*" multiple style="background:#fff;border-color:#ccc"></div>
      <div class="linha"><label id="qtdFotos">Nenhuma foto selecionada</label></div>
    </div>
  </div>
  <div class="rodape"><span id="msg"></span>
    <button class="sec2" id="novo">Novo</button><button id="salvar">Salvar e enviar para assinatura</button></div>
</div>

<div class="modal">
  <header><h1>Checklists e assinaturas</h1></header>
  <div class="corpo uma"><div class="col">
    <table class="lista"><thead><tr><th>Data</th><th>Cliente</th><th>Veículo</th><th>Placa</th><th>Assinatura</th><th></th></tr></thead>
    <tbody id="lista"></tbody></table></div></div>
</div>

<script src="erp.js"></script>
<script>
menu("checklist.html");

const PADRAO = [
  ["Lataria e pintura", "Frente (para-choque, capô, faróis)"], ["Lataria e pintura", "Laterais e portas"],
  ["Lataria e pintura", "Traseira (porta-malas, lanternas)"], ["Pneus e rodas", "Pneus e calotas/rodas"],
  ["Interior", "Bancos e forrações"], ["Interior", "Painel e luzes de alerta"], ["Vidros", "Para-brisa e vidros laterais"]
];
const tbody = document.querySelector("#itens tbody");
const emF = document.getElementById("emFuncionamento"), guincho = document.getElementById("veioDeGuincho");
const selAtend = document.getElementById("atendimentoId");

// ---------- inspeção ----------
function addLinha(secao, descricao) {
  const tr = document.createElement("tr");
  tr.innerHTML = `<td><input class="s" style="width:110px"></td>
    <td><input class="d" style="width:160px"></td>
    <td><select class="st"><option value="OK">OK</option><option value="PROBLEMA">Problema</option></select></td>
    <td><input class="o" style="width:110px"></td>
    <td><button class="sec2 x" type="button">&#10005;</button></td>`;
  tr.querySelector(".s").value = secao || ""; tr.querySelector(".d").value = descricao || "";
  tr.querySelector(".st").onchange = e => e.target.classList.toggle("rosa", e.target.value === "PROBLEMA");
  tr.querySelector(".x").onclick = () => tr.remove();
  tbody.appendChild(tr);
}
function itensPadrao() { tbody.innerHTML = ""; PADRAO.forEach(([s, d]) => addLinha(s, d)); }
document.getElementById("addItem").onclick = () => addLinha("", "");
itensPadrao();

// condição: só uma das duas (o backend também recusa as duas juntas)
emF.onchange = () => { if (emF.checked) guincho.checked = false; };
guincho.onchange = () => { if (guincho.checked) emF.checked = false; };

document.getElementById("fotos").onchange = e => {
  const n = e.target.files.length;
  document.getElementById("qtdFotos").textContent = n ? n + " foto(s) selecionada(s)" : "Nenhuma foto selecionada";
};

// ---------- pré-preenchimento pelo atendimento ----------
async function preencherDoAtendimento(id) {
  if (!id) return;
  try {
    const d = await pegarJson("/api/checklists/cliente/" + encodeURIComponent(id));
    ["nomeCliente", "endereco", "email", "telefone", "veiculo"].forEach(c => { if (d[c]) set(c, d[c]); });
  } catch { msg("Não foi possível carregar os dados do atendimento.", "erro"); }
}
selAtend.onchange = () => preencherDoAtendimento(selAtend.value);

function formatarData(iso) {
  return /^\d{4}-\d{2}-\d{2}$/.test(iso || "") ? iso.split("-").reverse().join("/") : (iso || "");
}

// ---------- listas ----------
async function carregar() {
  let checklists = [];
  try {
    const [cs, ats] = await Promise.all([pegarJson("/api/clientes"), pegarJson("/api/atendimentos")]);
    const nomes = Object.fromEntries(cs.map(c => [c.id, c.nome]));
    const atual = selAtend.value;
    selAtend.innerHTML = '<option value="">Selecione (opcional)</option>' +
      ats.sort((a, b) => (b.dataAgendamento || "").localeCompare(a.dataAgendamento || ""))
        .map(a => `<option value="${esc(a.id)}">${esc(formatarData(a.dataAgendamento))} - ${esc(nomes[a.clienteId] || "?")} - ${esc([a.marca, a.carro].filter(Boolean).join(" "))}</option>`).join("");
    selAtend.value = atual;
    checklists = await pegarJson("/api/checklists");
  } catch { msg("Não foi possível carregar as listas.", "erro"); }

  checklists.sort((a, b) => (b.dataInspecao || "").localeCompare(a.dataInspecao || ""));
  document.getElementById("lista").innerHTML = checklists.map(c => {
    const assinado = c.statusAssinatura === "ASSINADO";
    const status = assinado ? '<b style="color:#1e8449">Assinado</b>'
      : c.statusAssinatura === "PENDENTE" ? '<b style="color:#c0392b">Pendente (' + (c.lembretesEnviados || 0) + ' lembrete(s))</b>'
      : "Sem pedido";
    return `<tr><td>${esc(formatarData(c.dataInspecao))}</td><td>${esc(c.nomeCliente)}</td><td>${esc(c.veiculo)}</td>
      <td>${esc(c.placa)}</td><td>${status}</td>
      <td>${assinado ? "" : `<button class="sec2 reenviar" data-id="${esc(c.id)}">Reenviar e-mail</button>`}</td></tr>`;
  }).join("") || '<tr><td colspan="6">Nenhum checklist.</td></tr>';

  document.querySelectorAll("button.reenviar").forEach(b => b.onclick = async () => {
    b.disabled = true; msg("");
    try { await enviarJson("/api/checklists/" + b.dataset.id + "/reenviar-email", "POST", {}); msg("E-mail reenviado.", "ok"); carregar(); }
    catch (err) { msg(err.message, "erro"); b.disabled = false; }
  });
}

// ---------- novo / salvar ----------
function limpar() {
  ["atendimentoId","nomeCliente","endereco","email","telefone","veiculo","placa","kmOdometro","nivelGasolina","dataInspecao"]
    .forEach(id => set(id, ""));
  emF.checked = guincho.checked = false;
  document.getElementById("fotos").value = ""; document.getElementById("qtdFotos").textContent = "Nenhuma foto selecionada";
  itensPadrao(); msg("");
}
document.getElementById("novo").onclick = limpar;

document.getElementById("salvar").onclick = async e => {
  e.target.disabled = true; msg("Enviando...");
  try {
    const itens = [...tbody.querySelectorAll("tr")].map((tr, i) => ({
      numero: i + 1, secao: tr.querySelector(".s").value.trim(), descricao: tr.querySelector(".d").value.trim(),
      status: tr.querySelector(".st").value, obs: tr.querySelector(".o").value.trim() }))
      .filter(i => i.descricao);
    if (!itens.length) throw new Error("Preencha ao menos um item da inspeção.");

    const f = new FormData();
    ["nomeCliente","endereco","email","telefone","veiculo","placa","kmOdometro","nivelGasolina","dataInspecao","atendimentoId"]
      .forEach(id => { if (val(id) !== "") f.append(id, val(id)); });
    f.append("emFuncionamento", emF.checked); f.append("veioDeGuincho", guincho.checked);
    f.append("itensJson", JSON.stringify(itens));
    [...document.getElementById("fotos").files].forEach(file => f.append("fotos", file));

    const r = await fetch("/api/checklists", { method: "POST", body: f });
    const d = await lerResposta(r);
    if (!r.ok) throw new Error(d.erro || d.message || "Erro " + r.status);
    msg(d.emailEnviado ? "Checklist salvo e e-mail enviado ao cliente." : "Checklist salvo, mas o e-mail não foi enviado (use Reenviar e-mail).", "ok");
    carregar();
  } catch (err) { msg(err.message, "erro"); }
  e.target.disabled = false;
};

carregar().then(() => {
  const id = new URLSearchParams(location.search).get("atendimento");
  if (id) { selAtend.value = id; preencherDoAtendimento(id); }
});
</script>
</body></html>
